<!DOCTYPE html>
<html>
<head>
    <title>Classifieds Website</title>
    <style>
        body {
            font-family: Arial;
            background: #e3f2fd;
            text-align: center;
        }
        h1 {
            color: darkblue;
        }
        .product {
            background: white;
            padding: 15px;
            margin: 15px auto;
            width: 250px;
            border-radius: 10px;
        }
        button {
            background: blue;
            color: white;
            padding: 8px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Classifieds Website</h1>
    <h2>Used Products for Sale</h2>

    <div class="product">
        <h3>Old Bicycle</h3>
        <p>Price: ₹2000</p>
        <button onclick="buy('Old Bicycle')">Buy Now</button>
    </div>

    <div class="product">
        <h3>Used Laptop</h3>
        <p>Price: ₹12000</p>
        <button onclick="buy('Used Laptop')">Buy Now</button>
    </div>

    <div class="product">
        <h3>Study Table</h3>
        <p>Price: ₹1500</p>
        <button onclick="buy('Study Table')">Buy Now</button>
    </div>

    <script>
        function buy(product) {
            alert(product + " selected successfully!");
        }
    </script>

</body>
</html>
